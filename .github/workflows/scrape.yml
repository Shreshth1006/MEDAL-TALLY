name: Asian Para Games 2026 Medal Tally Scraper

on:
  schedule:
    - cron: "30 0-15 * * *"   # UTC 0:30–15:30 = IST 6:00 AM–9:00 PM, hourly
  workflow_dispatch:

concurrency:
  group: medal-tally
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright beautifulsoup4
          python -m playwright install --with-deps chromium

      - name: Run medal tally scraper
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python sc.py

      - name: Upload debug HTML on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
